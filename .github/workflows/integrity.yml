name: Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-files-match-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate site, README and artwork from profile.json
        run: |
          python build.py
          python tools/readme_art.py
      - name: Fail if anything committed is stale
        run: git diff --exit-code
